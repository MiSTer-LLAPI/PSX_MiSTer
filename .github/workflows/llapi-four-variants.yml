name: PSX official Single SDRAM comparison
on:
  workflow_dispatch:
  push:
    branches: [llapi-20261030-build]
permissions:
  contents: read
concurrency:
  group: psx-official-single-comparison
  cancel-in-progress: false
jobs:
  official-single:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MiSTer-devel/PSX_MiSTer
          ref: cd17b5a0ad261005c321d9d5ba41b8dbe313a7d3
          persist-credentials: false
      - name: Record official baseline and matching fitter configuration
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = cd17b5a0ad261005c321d9d5ba41b8dbe313a7d3
          mkdir -p reports
          python3 - <<'PYCODE'
          from pathlib import Path
          p=Path('PSX.qsf');s=p.read_bytes()
          for old,new in [(b'set_global_assignment -name SEED 1',b'set_global_assignment -name SEED 3'),(b'set_global_assignment -name ALM_REGISTER_PACKING_EFFORT LOW',b'set_global_assignment -name ALM_REGISTER_PACKING_EFFORT HIGH')]:
              assert s.count(old)==1
              s=s.replace(old,new,1)
          p.write_bytes(s)
          PYCODE
          git diff --binary > reports/compiled-settings.patch
          sha256sum PSX.qsf reports/compiled-settings.patch PSX.sdc files.qip > reports/compiled-settings.sha256
          cp PSX.qsf PSX.sdc reports/
          printf '%s\n' 'Official source cd17b5a0ad261005c321d9d5ba41b8dbe313a7d3, Single SDRAM.' 'ONLY QSF SEED1->3 and ALM_REGISTER_PACKING_EFFORT LOW->HIGH applied.' 'Compare existing LLAPI c16632f952811a60b66c6cbf1b54a23bd14bd112 + SEED2->3/PACKHIGH, run41195126632/job124519715778.' 'No official RTL/clock/SDC/features changes. Diagnostic artifacts only, no public RBF.' 'Quartus container digest matches prior LLAPI build.log.' > reports/BUILD-SOURCE.txt
          printf '%s\n' 'ghcr.io/raetro/quartus@sha256:55442b161163dc7723e3d4917ce046fcb682478365fe9320756c9a4ae7d7d4ce' > reports/CONTAINER.txt
          cat > diagnose-timing.tcl <<'TIMING'
          package require ::quartus::project
          package require ::quartus::sta
          project_open PSX
          create_timing_netlist
          read_sdc
          update_timing_netlist
          report_timing -setup -npaths 20 -detail full_path -file output_files/setup-critical-paths.txt
          report_timing -hold -npaths 10 -detail full_path -file output_files/hold-critical-paths.txt
          report_ucp -file output_files/unconstrained-paths.txt
          delete_timing_netlist
          project_close
          TIMING
          cat > compare-timing.py <<'PYCODE'
          from pathlib import Path
          import re,json
          p=Path('output_files/PSX.sta.rpt')
          values=[(k.strip(),float(v)) for k,v in re.findall(r'Worst-case ([A-Za-z ]+?) slack is\s+(-?\d+(?:\.\d+)?)',p.read_text(errors='replace'))]
          required={'setup','hold','recovery','removal','minimum pulse width'}
          if not required.issubset({k for k,v in values}):
              raise SystemExit('Timing report is incomplete; no RBF accepted.')
          result={'report':str(p),'worst_slack_ns':dict(values),'accepted':all(v>=0 for k,v in values)}
          Path('output_files/timing-acceptance.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          if not result['accepted']: raise SystemExit('Timing failed; no RBF accepted.')
          PYCODE
      - name: Compile official baseline and export full timing paths
        run: |
          set -euo pipefail
          docker run --rm -v "$GITHUB_WORKSPACE:/build" -w /build ghcr.io/raetro/quartus@sha256:55442b161163dc7723e3d4917ce046fcb682478365fe9320756c9a4ae7d7d4ce bash -c 'set -uo pipefail; quartus_sh --flow compile PSX; compile_status=$?; quartus_sta -t diagnose-timing.tcl > reports/diagnose-timing.log 2>&1; diagnosis_status=$?; if [ "$compile_status" -ne 0 ]; then exit "$compile_status"; fi; if [ "$diagnosis_status" -ne 0 ]; then exit "$diagnosis_status"; fi; python3 compare-timing.py' > reports/build.log 2>&1 || { tail -100 reports/build.log; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-single-seed3-packhigh-comparison
          path: |
            reports/
            output_files/*.rpt
            output_files/*-paths.txt
            output_files/timing-acceptance.json
          if-no-files-found: error
# Diagnostic comparison only; no RBF packaging or release publication.

