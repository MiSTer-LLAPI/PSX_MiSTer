name: PSX Enhanced Single RAM receive storage assessment
on:
  push:
    branches: [enhanced-single-rx-shift]
    paths: [.github/workflows/psx-enhanced-single.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: psx-enhanced-single-timing
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: c16632f952811a60b66c6cbf1b54a23bd14bd112
      - name: Apply tested Enhanced integration and matched configuration
        run: |
          set -euo pipefail
          mkdir -p reports package
          test "$(git rev-parse HEAD)" = c16632f952811a60b66c6cbf1b54a23bd14bd112
          echo  | base64 -d > reports/integration.patch
          echo '7ef5d55846a2959524b1400b6aeab5bc1de913cf4e5ba294d85381d10fa37a05  reports/integration.patch' | sha256sum -c -
          git apply --check reports/integration.patch
          git apply reports/integration.patch
          echo  | base64 -d > reports/count-width.patch
          echo '0061901b0104bb45e14677759db74afdbce5d11e1ed35f622c4e03bba22a8462  reports/count-width.patch' | sha256sum -c -
          git apply --check reports/count-width.patch
          git apply reports/count-width.patch
          echo  | base64 -d > reports/snapshot-storage.patch
          echo '739415f0518da81b32086a3141a1b76b7a8e656d19582398a5ffd5ae329dc84c  reports/snapshot-storage.patch' | sha256sum -c -
          git apply --check reports/snapshot-storage.patch
          git apply reports/snapshot-storage.patch
          echo  | base64 -d > reports/timer-width.patch
          echo '0f45ba936d8c30b5eafceccf86dc2e66f45a8fd4160b57d9c5622fc905029ebe  reports/timer-width.patch' | sha256sum -c -
          git apply --check reports/timer-width.patch
          git apply reports/timer-width.patch
          echo  | base64 -d > reports/driver-v021.patch
          echo "3f1e0de1a30c5ab0bbe5a826b0853448763e0e4eb601e435181f47dbbe35d2b4  reports/driver-v021.patch" | sha256sum -c -
          git apply --check reports/driver-v021.patch
          git apply reports/driver-v021.patch
          echo  | base64 -d > reports/menu-auto-rumble.patch
          echo "f3d7583d1163067cce40228c70b2af456e43404109f60db124ba1859a59f8f92  reports/menu-auto-rumble.patch" | sha256sum -c -
          git apply --check reports/menu-auto-rumble.patch
          git apply reports/menu-auto-rumble.patch
          echo  | base64 -d > reports/disable-unused-snac.patch
          echo "9125136ed5605ba1587cb7063599c52c397a7ecf2b70c11e1c5145184b656aa7  reports/disable-unused-snac.patch" | sha256sum -c -
          git apply --check reports/disable-unused-snac.patch
          git apply reports/disable-unused-snac.patch
          echo  | base64 -d > reports/rx-shift.patch
          echo "9d2ea3ed19565dca80ea09d2db99cadf64300ac12c32ae5e8e5807ea69a3e893  reports/rx-shift.patch" | sha256sum -c -
          git apply --check reports/rx-shift.patch
          git apply reports/rx-shift.patch
          sed -i -E 's/(set_global_assignment -name SEED) 2/\1 3/; s/(set_global_assignment -name ALM_REGISTER_PACKING_EFFORT) LOW/\1 HIGH/' PSX.qsf
          echo 'a0aa479f1a58227838162fce2ceb6e04fafd9c4fbeefb01a5ade38df2cc5d072  PSX.qsf' | sha256sum -c -
          echo 'c9a18fe8cd7d79187f3c7bbcbc9d1a33b625304bd704e7229d0ede50f50b0ac0  rtl/llapi_enhanced.sv' | sha256sum -c -
          cp PSX.qsf reports/
          git diff --binary > reports/tracked-changes.patch
          printf 'Base: c16632f952811a60b66c6cbf1b54a23bd14bd112\nWorkflow: %s\nEnhanced integration plus validated count21-to9 width reduction and direct receive-buffer snapshot decode plus bounded saturating transaction timer, byte-wise RX shifting and matched SEED3/PACKHIGH. No clock/SDC changes. Hardware untested.\n' "$GITHUB_SHA" > reports/BUILD-SOURCE.txt
          mkdir compiled-source
          git archive HEAD | tar -x -C compiled-source
          git apply --directory=compiled-source reports/integration.patch
          git apply --directory=compiled-source reports/count-width.patch
          git apply --directory=compiled-source reports/snapshot-storage.patch
          git apply --directory=compiled-source reports/timer-width.patch
          git apply --directory=compiled-source reports/driver-v021.patch
          git apply --directory=compiled-source reports/menu-auto-rumble.patch
          git apply --directory=compiled-source reports/disable-unused-snac.patch
          git apply --directory=compiled-source reports/rx-shift.patch
          cmp PSX.sv compiled-source/PSX.sv
          cmp rtl/llapi_enhanced.sv compiled-source/rtl/llapi_enhanced.sv
          cp PSX.qsf compiled-source/
          echo  | base64 -d > compiled-source/LLAPI-VERSION.json
          cp compiled-source/LLAPI-VERSION.json reports/
          tar -czf reports/SOURCE-compiled.tar.gz -C compiled-source .
          cat > diagnose-timing.tcl <<'TIMING'
          package require ::quartus::project
          package require ::quartus::sta
          project_open PSX
          create_timing_netlist
          read_sdc
          update_timing_netlist
          report_timing -setup -npaths 50 -detail full_path -file output_files/setup-critical-paths.txt
          report_timing -hold -npaths 50 -detail full_path -file output_files/hold-critical-paths.txt
          report_ucp -file output_files/unconstrained-paths.txt
          delete_timing_netlist
          project_close
          TIMING
      - name: Validate controllers
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y iverilog
          bash tests/llapi/run.sh 2>&1 | tee reports/controller-tests.log
          echo  | base64 -d > reports/rx-baseline.sv
          echo  | base64 -d > reports/rx-equivalence_tb.sv
          for test in TYPE_RECONNECT PRESSURE_FAULTS PAYLOAD_FAULTS RESET_PAYLOAD PATTERN_SWEEP; do
            iverilog -g2012 -s features_tb -Pfeatures_tb.$test=1 -o /tmp/rx-eq rtl/llapi_enhanced.sv reports/rx-baseline.sv reports/rx-equivalence_tb.sv
            vvp /tmp/rx-eq >> reports/rx-equivalence.log
          done
      - name: Compile Single RAM and apply strict timing gate
        run: |
          set -euo pipefail
          docker run --rm -v "$GITHUB_WORKSPACE:/build" -w /build ghcr.io/raetro/quartus@sha256:55442b161163dc7723e3d4917ce046fcb682478365fe9320756c9a4ae7d7d4ce bash -c 'set -uo pipefail; quartus_sh --version > reports/QUARTUS-VERSION.txt; quartus_sh --flow compile PSX; compile_status=$?; quartus_sta -t diagnose-timing.tcl > reports/diagnose-timing.log 2>&1; diagnosis_status=$?; if [ "$compile_status" -ne 0 ]; then exit "$compile_status"; fi; if [ "$diagnosis_status" -ne 0 ]; then exit "$diagnosis_status"; fi; python3 tests/llapi/timing.py PSX' > reports/build.log 2>&1 || { tail -100 reports/build.log; exit 1; }
          cp output_files/PSX.rbf package/PSX_LLAPI_Enhanced_SingleRAM.rbf
          cp output_files/timing-acceptance.json package/TIMING.json
          cp reports/SOURCE-compiled.tar.gz reports/BUILD-SOURCE.txt package/
          cp LLAPI-ENHANCED.md package/LEGACY-INTEGRATION-NOTES.md
          cp reports/LLAPI-VERSION.json reports/QUARTUS-VERSION.txt package/
          printf "%s\n" "PSX Single RAM LLAPI Enhanced 0.2.1-dev+rx-shift candidate. USER I/O: LLAPI 2P, enabled outside OSD. Rumble automatically follows supported controller game requests, inhibited during pause/OSD/reset. Finite-jolt transport; no independent motor intensity or hardware validation claimed. SNAC disabled to recover FPGA space; old SNAC pad selection is Unavailable. Other pad encodings and virtual memory cards preserved. UltimateMiSTer.com (RickDangerous). Original authors and licenses retained. LEGACY-INTEGRATION-NOTES.md describes prior integration; current behavior is defined here." > package/README.md
          cp COPYING package/LICENSE 2>/dev/null || cp LICENSE package/LICENSE
          (cd package && sha256sum *.rbf SOURCE-compiled.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: psx-enhanced-single-accepted
          path: package/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psx-enhanced-single-reports
          path: |
            reports/
            output_files/*.rpt
            output_files/*-paths.txt
            output_files/timing-acceptance.json
# No release or distribution. Failed timing retains reports only, never a distributable RBF.
